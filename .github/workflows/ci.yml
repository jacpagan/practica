name: CI

on:
  pull_request:
    paths-ignore:
      - 'apps/frontend/**'
      - 'docs/**'
      - '*.md'
  push:
    branches: [ main ]
    paths-ignore:
      - 'apps/frontend/**'
      - 'docs/**'
      - '*.md'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  secrets-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Guard against committed secrets
        run: bash scripts/guard-no-secrets.sh

  backend-lint:
    needs: [secrets-guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The changed-file gate needs the base commit on both pushes and PRs.
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - name: Install Ruff
        # Pin the tool so a new Ruff release cannot unexpectedly break main.
        run: pip install 'ruff==0.12.11'

      # Existing lint debt must not hide real correctness failures.
      - name: Ruff critical correctness gate
        run: >-
          ruff check
          --select E9,F63,F7,F82
          apps/backend/practica/
          apps/backend/videos/

      # Enforce the full configured/default rules on code touched by this change.
      # This keeps the debt from growing without forcing a risky 300+ issue cleanup
      # as part of an unrelated release.
      - name: Ruff changed Python files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BASE_SHA"
          fi

          # GitHub uses an all-zero SHA when there is no usable previous commit.
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "No usable base SHA; critical whole-backend gate already passed."
            exit 0
          fi

          mapfile -t files < <(
            git diff --diff-filter=ACMR --name-only "$base" "${GITHUB_SHA}" -- \
              apps/backend/practica/ apps/backend/videos/ \
              | grep -E '\.py$' || true
          )

          if (( ${#files[@]} == 0 )); then
            echo "No changed backend Python files to lint."
            exit 0
          fi

          printf 'Linting changed files:\n - %s\n' "${files[@]}"
          ruff check "${files[@]}"

      # Keep visibility on legacy debt, but do not let unrelated pre-existing
      # style issues block production. Remove continue-on-error once debt is paid.
      - name: Ruff full backend debt report
        continue-on-error: true
        run: ruff check apps/backend/practica/ apps/backend/videos/

  backend-core-loop:
    needs: [secrets-guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Install frontend deps
        working-directory: apps/frontend
        run: npm ci --no-audit --no-fund
      - name: Run core-loop gate
        run: bash scripts/test-core-loop.sh

  # Frontend checks consolidated under .github/workflows/frontend-ci.yml
