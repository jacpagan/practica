name: Prod Host Maintenance

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Maintenance mode: report, auto, or prune"
        required: true
        default: "report"
      prune_threshold:
        description: "Disk usage percent threshold for auto mode"
        required: true
        default: "85"
      alert_threshold:
        description: "Disk usage percent that should page after maintenance"
        required: true
        default: "90"
      backup_max_age_hours:
        description: "Maximum acceptable age for the latest production backup"
        required: true
        default: "36"
  schedule:
    - cron: '17 */6 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  maintain:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Prepare script payload
        id: payload
        run: |
          SCRIPT_B64=$(base64 < scripts/prod-host-maintenance.sh | tr -d '\n')
          echo "script_b64=$SCRIPT_B64" >> "$GITHUB_OUTPUT"

      - name: Run maintenance via SSM
        id: run_maintenance
        env:
          INSTANCE_ID: ${{ secrets.INSTANCE_ID }}
          MODE: ${{ github.event_name == 'schedule' && 'auto' || github.event.inputs.mode }}
          PRUNE_THRESHOLD: ${{ github.event_name == 'schedule' && '85' || github.event.inputs.prune_threshold }}
          ALERT_THRESHOLD: ${{ github.event_name == 'schedule' && '90' || github.event.inputs.alert_threshold }}
          BACKUP_MAX_AGE_HOURS: ${{ github.event_name == 'schedule' && '36' || github.event.inputs.backup_max_age_hours }}
          SCRIPT_B64: ${{ steps.payload.outputs.script_b64 }}
        run: |
          COMMAND=$(cat <<EOF
          mkdir -p /tmp && \
          echo '$SCRIPT_B64' | base64 -d > /tmp/practica-host-maintenance.sh && \
          chmod +x /tmp/practica-host-maintenance.sh && \
          PRUNE_THRESHOLD='$PRUNE_THRESHOLD' ALERT_THRESHOLD='$ALERT_THRESHOLD' BACKUP_MAX_AGE_HOURS='$BACKUP_MAX_AGE_HOURS' /bin/bash /tmp/practica-host-maintenance.sh '$MODE'
          EOF
          )
          ESCAPED=$(printf '%s' "$COMMAND" | sed 's/\\/\\\\/g; s/"/\\"/g')
          PARAMS="{\"commands\":[\"$ESCAPED\"]}"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Practica prod host maintenance" \
            --timeout-seconds 1200 \
            --parameters "$PARAMS" \
            --query "Command.CommandId" --output text)
          echo "SSM CommandId: $CMD_ID"

          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query 'Status' --output text 2>/dev/null || echo "Pending")
            echo "SSM status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              OUTPUT=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text)
              printf '%s\n' "$OUTPUT"
              {
                echo 'output<<EOF'
                printf '%s\n' "$OUTPUT"
                echo 'EOF'
              } >> "$GITHUB_OUTPUT"
              LOW_DISK_ALERT=$(printf '%s\n' "$OUTPUT" | sed -n 's/^alert_low_disk=//p' | tail -n 1)
              BACKUP_ALERT=$(printf '%s\n' "$OUTPUT" | sed -n 's/^alert_backup=//p' | tail -n 1)
              FINAL_DISK_USE=$(printf '%s\n' "$OUTPUT" | sed -n 's/^final_disk_use_pct=//p' | tail -n 1)
              BACKUP_STATUS=$(printf '%s\n' "$OUTPUT" | sed -n 's/^backup_status=//p' | tail -n 1)
              echo "low_disk_alert=${LOW_DISK_ALERT:-0}" >> "$GITHUB_OUTPUT"
              echo "backup_alert=${BACKUP_ALERT:-0}" >> "$GITHUB_OUTPUT"
              echo "final_disk_use_pct=${FINAL_DISK_USE:-unknown}" >> "$GITHUB_OUTPUT"
              echo "backup_status=${BACKUP_STATUS:-unknown}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --output text || true
              exit 1
            fi
            sleep 5
          done

          echo "Maintenance run timed out" >&2
          exit 1

      - name: Maintenance summary
        if: ${{ always() && steps.run_maintenance.outputs.output != '' }}
        run: |
          {
            echo "### Prod Host Maintenance"
            echo "- Mode: \`${{ github.event_name == 'schedule' && 'auto' || github.event.inputs.mode }}\`"
            echo "- Final disk use: \`${{ steps.run_maintenance.outputs.final_disk_use_pct || 'unknown' }}%\`"
            echo "- Backup status: \`${{ steps.run_maintenance.outputs.backup_status || 'unknown' }}\`"
            echo "- Low disk alert: \`${{ steps.run_maintenance.outputs.low_disk_alert || '0' }}\`"
            echo "- Backup alert: \`${{ steps.run_maintenance.outputs.backup_alert || '0' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack on maintenance alert or failure
        if: ${{ failure() || steps.run_maintenance.outputs.low_disk_alert == '1' || steps.run_maintenance.outputs.backup_alert == '1' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODE: ${{ github.event_name == 'schedule' && 'auto' || github.event.inputs.mode }}
          FINAL_DISK_USE: ${{ steps.run_maintenance.outputs.final_disk_use_pct }}
          BACKUP_STATUS: ${{ steps.run_maintenance.outputs.backup_status }}
          LOW_DISK_ALERT: ${{ steps.run_maintenance.outputs.low_disk_alert }}
          BACKUP_ALERT: ${{ steps.run_maintenance.outputs.backup_alert }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::warning::SLACK_WEBHOOK_URL not configured; skipping Slack maintenance alert."
            exit 0
          fi
          MSG=":warning: Practica prod maintenance needs attention\nMode: ${MODE:-auto}\nDisk use: ${FINAL_DISK_USE:-unknown}%\nBackup status: ${BACKUP_STATUS:-unknown}\nLow disk alert: ${LOW_DISK_ALERT:-0}\nBackup alert: ${BACKUP_ALERT:-0}\nRun: ${RUN_URL}"
          ESCAPED_MSG=$(printf '%s' "$MSG" | sed 's/\\/\\\\/g; s/"/\\"/g; s/$/\\n/' | tr -d '\n')
          PAYLOAD="{\"text\":\"${ESCAPED_MSG}\"}"
          curl -fsS -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL" || \
            echo "::warning::Slack maintenance alert failed."
