name: Reset member password
on:
  workflow_dispatch:
    inputs:
      username:
        required: true
        type: string
      password_hash:
        description: Django encoded password (never a plaintext password)
        required: true
        type: string
permissions:
  id-token: write
  contents: read
jobs:
  reset:
    runs-on: ubuntu-24.04
    steps:
      - uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Reset specified member through SSM
        env:
          INSTANCE_ID: ${{ secrets.INSTANCE_ID }}
          MEMBER: ${{ inputs.username }}
          PASSWORD_HASH: ${{ inputs.password_hash }}
        run: |
          python3 - <<'PY'
          import base64, json, os, shlex, subprocess, time
          code = "from django.contrib.auth import get_user_model; from rest_framework.authtoken.models import Token; u=get_user_model().objects.get(username=" + repr(os.environ['MEMBER']) + "); u.password=" + repr(os.environ['PASSWORD_HASH']) + "; u.save(update_fields=['password']); Token.objects.filter(user=u).delete(); print('Password reset completed')"
          encoded = base64.b64encode(code.encode()).decode()
          shell_code = "import base64; exec(base64.b64decode(" + repr(encoded) + "))"
          command = 'cd /opt/practica && docker compose -f docker-compose.prod.yml exec -T backend python /app/apps/backend/manage.py shell -c ' + shlex.quote(shell_code)
          result = json.loads(subprocess.check_output(['aws','ssm','send-command','--instance-ids',os.environ['INSTANCE_ID'],'--document-name','AWS-RunShellScript','--parameters',json.dumps({'commands':[command]})]))
          command_id = result['Command']['CommandId']
          for attempt in range(60):
              time.sleep(3)
              response = subprocess.run(['aws','ssm','get-command-invocation','--command-id',command_id,'--instance-id',os.environ['INSTANCE_ID']],capture_output=True,text=True)
              if response.returncode: continue
              invocation = json.loads(response.stdout)
              if invocation['Status'] == 'Success':
                  print('Password reset completed'); break
              if invocation['Status'] in ('Failed','Cancelled','TimedOut'): raise SystemExit('Password reset failed')
          else: raise SystemExit('Password reset timed out')
          PY
