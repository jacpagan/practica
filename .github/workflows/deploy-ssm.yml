name: Deploy via SSM

# Solo mode release strategy:
# - main -> production only
# - no staging promotion path enabled
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'AGENTS.md'
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch/SHA)"
        required: false
        default: "main"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: production-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to EC2 via SSM (no SSH)
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate release strategy guardrails
        run: bash scripts/check-release-strategy.sh

      - name: Resolve ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            REF="$GITHUB_SHA"
          else
            REF="${{ github.event.inputs.ref || 'main' }}"
          fi
          echo "ref=$REF" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Ensure ECR repository exists
        env:
          ECR_REPOSITORY: practica-backend
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$ECR_REPOSITORY" --image-scanning-configuration scanOnPush=true >/dev/null

      - name: Login to Amazon ECR
        id: login_ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve ECR deploy auth
        id: ecr_deploy_auth
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          REGISTRY: ${{ steps.login_ecr.outputs.registry }}
        run: |
          PASSWORD=$(aws ecr get-login-password --region "$AWS_REGION")
          echo "::add-mask::$PASSWORD"
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          {
            echo 'password<<EOF'
            echo "$PASSWORD"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        id: backend_image
        env:
          REGISTRY: ${{ steps.login_ecr.outputs.registry }}
          ECR_REPOSITORY: practica-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -f apps/backend/Dockerfile -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Send SSM deploy command
        id: send_ssm
        env:
          INSTANCE_ID: ${{ secrets.INSTANCE_ID }}
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
          GIT_REF: ${{ steps.ref.outputs.ref }}
          BACKEND_IMAGE: ${{ steps.backend_image.outputs.image_uri }}
          ECR_REGISTRY: ${{ steps.ecr_deploy_auth.outputs.registry }}
          ECR_PASSWORD: ${{ steps.ecr_deploy_auth.outputs.password }}
          AWS_MEDIA_CONVERT_ROLE_ARN: ${{ secrets.AWS_MEDIA_CONVERT_ROLE_ARN }}
          AWS_MEDIA_CONVERT_ENDPOINT_URL: ${{ secrets.AWS_MEDIA_CONVERT_ENDPOINT_URL }}
          PUBLIC_VERIFY_TIMEOUT_SECONDS: 900
          PUBLIC_VERIFY_INTERVAL_SECONDS: 5
          PUBLIC_STABLE_SUCCESSES: 3
        run: bash scripts/deploy-via-ssm.sh

      - name: Deployment summary
        if: always()
        run: |
          COMMIT_SHA="${GITHUB_SHA}"
          DEPLOYED_REF="${{ steps.ref.outputs.ref }}"
          SSM_COMMAND_ID="${{ steps.send_ssm.outputs.command_id }}"
          SSM_STATUS="${{ steps.send_ssm.outputs.ssm_status }}"
          [ -z "$SSM_COMMAND_ID" ] && SSM_COMMAND_ID="n/a"
          [ -z "$SSM_STATUS" ] && SSM_STATUS="n/a"

          echo "Deploy summary:"
          echo "commit_sha=$COMMIT_SHA"
          echo "deployed_ref=$DEPLOYED_REF"
          echo "backend_image=${{ steps.backend_image.outputs.image_uri }}"
          echo "ssm_command_id=$SSM_COMMAND_ID"
          echo "ssm_status=$SSM_STATUS"
          echo "health_gate=backend+public required"

          {
            echo "### Production Deploy Summary"
            echo "- Commit SHA: \`$COMMIT_SHA\`"
            echo "- Deployed ref: \`$DEPLOYED_REF\`"
            echo "- Backend image: \`${{ steps.backend_image.outputs.image_uri }}\`"
            echo "- SSM command id: \`$SSM_COMMAND_ID\`"
            echo "- SSM status: \`$SSM_STATUS\`"
            echo "- Health gate: \`backend + public health required\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack on deploy failure
        if: ${{ failure() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOYED_REF: ${{ steps.ref.outputs.ref }}
          SSM_COMMAND_ID: ${{ steps.send_ssm.outputs.command_id }}
          SSM_STATUS: ${{ steps.send_ssm.outputs.ssm_status }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::warning::SLACK_WEBHOOK_URL not configured; skipping Slack deploy-failure notification."
            exit 0
          fi
          REF_VALUE="${DEPLOYED_REF:-${GITHUB_REF_NAME:-main}}"
          SSM_CMD_VALUE="${SSM_COMMAND_ID:-n/a}"
          SSM_STATUS_VALUE="${SSM_STATUS:-n/a}"
          MSG=":rotating_light: Practica production deploy failed\nRepo: ${GITHUB_REPOSITORY}\nRef: ${REF_VALUE}\nCommit: ${GITHUB_SHA}\nRun: ${RUN_URL}\nSSM Status: ${SSM_STATUS_VALUE}\nSSM Command ID: ${SSM_CMD_VALUE}"
          ESCAPED_MSG=$(printf '%s' "$MSG" | sed 's/\\/\\\\/g; s/"/\\"/g; s/$/\\n/' | tr -d '\n')
          PAYLOAD="{\"text\":\"${ESCAPED_MSG}\"}"
          curl -fsS -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL" || \
            echo "::warning::Slack deploy-failure notification failed."
