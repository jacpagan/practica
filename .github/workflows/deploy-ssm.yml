name: Deploy via SSM

# Solo mode release strategy:
# - main -> production only
# - no staging promotion path enabled
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'AGENTS.md'
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch/SHA)"
        required: false
        default: "main"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: production-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to EC2 via SSM (no SSH)
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate release strategy guardrails
        run: bash scripts/check-release-strategy.sh

      - name: Resolve ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            REF="$GITHUB_SHA"
          else
            REF="${{ github.event.inputs.ref || 'main' }}"
          fi
          echo "ref=$REF" >> $GITHUB_OUTPUT

      - name: Wait for required validation workflows to succeed
        uses: actions/github-script@v7
        env:
          TARGET_REF: ${{ steps.ref.outputs.ref }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const timeoutMs = 15 * 60 * 1000;
            const intervalMs = 15000;
            const start = Date.now();
            const targetRef = process.env.TARGET_REF || context.sha;

            async function getCommit(ref) {
              const commit = await github.rest.repos.getCommit({owner, repo, ref});
              return commit.data;
            }

            const targetCommit = context.eventName === 'push'
              ? { sha: context.sha, parents: (context.payload.head_commit?.parents || []).map((parent) => ({ sha: parent })), files: [] }
              : await getCommit(targetRef);
            const targetSha = targetCommit.sha;

            function matchesPattern(file, pattern) {
              if (pattern.endsWith('/**')) {
                return file.startsWith(pattern.slice(0, -2));
              }
              if (pattern === '*.md') {
                return !file.includes('/') && file.endsWith('.md');
              }
              return file === pattern;
            }

            function matchesAny(file, patterns) {
              return patterns.some((pattern) => matchesPattern(file, pattern));
            }

            async function waitForWorkflow(workflowFile, label) {
              async function getRun() {
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: workflowFile,
                  head_sha: targetSha,
                  per_page: 10,
                });
                return runs.data.workflow_runs[0];
              }

              let run;
              while (Date.now() - start < timeoutMs) {
                run = await getRun();
                if (run && run.status === 'completed') {
                  if (run.conclusion === 'success') {
                    core.info(`${label} succeeded: ${run.html_url}`);
                    return true;
                  }
                  core.setFailed(`${label} not successful (conclusion=${run.conclusion}). ${run.html_url}`);
                  return false;
                }
                core.info(`Waiting for ${label} to complete...`);
                await new Promise((resolve) => setTimeout(resolve, intervalMs));
              }

              core.setFailed(`Timed out waiting for ${label} to succeed.`);
              return false;
            }

            const workflowsToWaitFor = [];
            const changedFiles = [];

            if (context.eventName === 'push') {
              const before = context.payload.before;
              if (before && !/^0+$/.test(before)) {
                const comparison = await github.rest.repos.compareCommits({
                  owner,
                  repo,
                  base: before,
                  head: targetSha,
                });
                for (const file of comparison.data.files || []) {
                  if (file?.filename) changedFiles.push(file.filename);
                }
              }
            } else {
              const firstParentSha = targetCommit.parents?.[0]?.sha || '';
              if (firstParentSha) {
                const comparison = await github.rest.repos.compareCommits({
                  owner,
                  repo,
                  base: firstParentSha,
                  head: targetSha,
                });
                for (const file of comparison.data.files || []) {
                  if (file?.filename) changedFiles.push(file.filename);
                }
              } else {
                for (const file of targetCommit.files || []) {
                  if (file?.filename) changedFiles.push(file.filename);
                }
              }
            }

            const ciIgnoredPatterns = ['apps/frontend/**', 'docs/**', '*.md'];
            const frontendPatterns = ['apps/frontend/**', '.github/workflows/frontend-ci.yml'];

            const requiresCi = changedFiles.some((file) => !matchesAny(file, ciIgnoredPatterns));
            const requiresFrontendCi = changedFiles.some((file) => matchesAny(file, frontendPatterns));

            if (requiresCi) {
              workflowsToWaitFor.push({ file: '.github/workflows/ci.yml', label: 'CI workflow' });
            }
            if (requiresFrontendCi) {
              workflowsToWaitFor.push({ file: '.github/workflows/frontend-ci.yml', label: 'Frontend CI workflow' });
            }

            core.info(`Target ref: ${targetRef}`);
            core.info(`Target sha: ${targetSha}`);
            core.info(`Changed files (${changedFiles.length}): ${changedFiles.join(', ') || 'none detected'}`);
            core.info(`Required validations: ${workflowsToWaitFor.map((item) => item.label).join(', ') || 'none'}`);

            for (const workflow of workflowsToWaitFor) {
              const ok = await waitForWorkflow(workflow.file, workflow.label);
              if (!ok) {
                return;
              }
            }

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Ensure ECR repository exists
        env:
          ECR_REPOSITORY: practica-backend
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$ECR_REPOSITORY" --image-scanning-configuration scanOnPush=true >/dev/null

      - name: Login to Amazon ECR
        id: login_ecr
        uses: aws-actions/amazon-ecr-login@4282e2b4f4018fbb1d76a177de8ce052de19b55e # v2.1.1

      - name: Resolve ECR deploy auth
        id: ecr_deploy_auth
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          REGISTRY: ${{ steps.login_ecr.outputs.registry }}
        run: |
          PASSWORD=$(aws ecr get-login-password --region "$AWS_REGION")
          echo "::add-mask::$PASSWORD"
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          {
            echo 'password<<EOF'
            echo "$PASSWORD"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        id: backend_image
        env:
          REGISTRY: ${{ steps.login_ecr.outputs.registry }}
          ECR_REPOSITORY: practica-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -f apps/backend/Dockerfile -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Send SSM deploy command
        id: send_ssm
        env:
          INSTANCE_ID: ${{ secrets.INSTANCE_ID }}
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
          GIT_REF: ${{ steps.ref.outputs.ref }}
          BACKEND_IMAGE: ${{ steps.backend_image.outputs.image_uri }}
          ECR_REGISTRY: ${{ steps.ecr_deploy_auth.outputs.registry }}
          ECR_PASSWORD: ${{ steps.ecr_deploy_auth.outputs.password }}
          AWS_MEDIA_CONVERT_ROLE_ARN: ${{ secrets.AWS_MEDIA_CONVERT_ROLE_ARN }}
          AWS_MEDIA_CONVERT_ENDPOINT_URL: ${{ secrets.AWS_MEDIA_CONVERT_ENDPOINT_URL }}
          ADMIN_URL: ${{ secrets.ADMIN_URL }}
          PUBLIC_VERIFY_TIMEOUT_SECONDS: 900
          PUBLIC_VERIFY_INTERVAL_SECONDS: 5
          PUBLIC_STABLE_SUCCESSES: 3
        run: bash scripts/deploy-via-ssm.sh

      - name: Deployment summary
        if: always()
        run: |
          COMMIT_SHA="${GITHUB_SHA}"
          DEPLOYED_REF="${{ steps.ref.outputs.ref }}"
          SSM_COMMAND_ID="${{ steps.send_ssm.outputs.command_id }}"
          SSM_STATUS="${{ steps.send_ssm.outputs.ssm_status }}"
          [ -z "$SSM_COMMAND_ID" ] && SSM_COMMAND_ID="n/a"
          [ -z "$SSM_STATUS" ] && SSM_STATUS="n/a"

          echo "Deploy summary:"
          echo "commit_sha=$COMMIT_SHA"
          echo "deployed_ref=$DEPLOYED_REF"
          echo "backend_image=${{ steps.backend_image.outputs.image_uri }}"
          echo "ssm_command_id=$SSM_COMMAND_ID"
          echo "ssm_status=$SSM_STATUS"
          echo "health_gate=backend+public required"

          {
            echo "### Production Deploy Summary"
            echo "- Commit SHA: \`$COMMIT_SHA\`"
            echo "- Deployed ref: \`$DEPLOYED_REF\`"
            echo "- Backend image: \`${{ steps.backend_image.outputs.image_uri }}\`"
            echo "- SSM command id: \`$SSM_COMMAND_ID\`"
            echo "- SSM status: \`$SSM_STATUS\`"
            echo "- Health gate: \`backend + public health required\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack on deploy failure
        if: ${{ failure() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOYED_REF: ${{ steps.ref.outputs.ref }}
          SSM_COMMAND_ID: ${{ steps.send_ssm.outputs.command_id }}
          SSM_STATUS: ${{ steps.send_ssm.outputs.ssm_status }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::warning::SLACK_WEBHOOK_URL not configured; skipping Slack deploy-failure notification."
            exit 0
          fi
          REF_VALUE="${DEPLOYED_REF:-${GITHUB_REF_NAME:-main}}"
          SSM_CMD_VALUE="${SSM_COMMAND_ID:-n/a}"
          SSM_STATUS_VALUE="${SSM_STATUS:-n/a}"
          MSG=":rotating_light: Practica production deploy failed\nRepo: ${GITHUB_REPOSITORY}\nRef: ${REF_VALUE}\nCommit: ${GITHUB_SHA}\nRun: ${RUN_URL}\nSSM Status: ${SSM_STATUS_VALUE}\nSSM Command ID: ${SSM_CMD_VALUE}"
          ESCAPED_MSG=$(printf '%s' "$MSG" | sed 's/\\/\\\\/g; s/"/\\"/g; s/$/\\n/' | tr -d '\n')
          PAYLOAD="{\"text\":\"${ESCAPED_MSG}\"}"
          curl -fsS -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL" || \
            echo "::warning::Slack deploy-failure notification failed."
