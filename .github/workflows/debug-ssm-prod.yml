name: Debug Prod via SSM

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Shell command to run on production instance"
        required: true
        default: "hostname && pwd && ls -la /opt/practica | tail -n 20"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  debug:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Send SSM command
        id: send
        env:
          INSTANCE_ID: ${{ secrets.INSTANCE_ID }}
          COMMAND: ${{ github.event.inputs.command }}
        run: |
          ESCAPED=$(printf '%s' "$COMMAND" | sed 's/\\/\\\\/g; s/"/\\"/g')
          PARAMS="{\"commands\":[\"$ESCAPED\"]}"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Practica prod debug" \
            --timeout-seconds 600 \
            --parameters "$PARAMS" \
            --query "Command.CommandId" --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"

      - name: Wait and print output
        env:
          INSTANCE_ID: ${{ secrets.INSTANCE_ID }}
          CMD_ID: ${{ steps.send.outputs.command_id }}
        run: |
          STATUS="Pending"
          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query 'Status' --output text 2>/dev/null || echo "Pending")
            echo "SSM status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              break
            fi
            if [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --output text || true
              exit 1
            fi
            sleep 2
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text
