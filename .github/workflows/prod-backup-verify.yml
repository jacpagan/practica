name: Prod Backup Verify

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Backup mode: create_and_verify or verify_latest"
        required: true
        default: "create_and_verify"
      keep_count:
        description: "How many backups to retain on host"
        required: true
        default: "10"
      backup_max_age_hours:
        description: "Maximum acceptable age for the latest backup"
        required: true
        default: "36"
  schedule:
    - cron: '43 8 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: production-backup-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Prepare script payload
        id: payload
        run: |
          SCRIPT_B64=$(base64 < scripts/prod-backup-verify.sh | tr -d '\n')
          echo "script_b64=$SCRIPT_B64" >> "$GITHUB_OUTPUT"

      - name: Run backup verification via SSM
        id: run_backup_verify
        env:
          INSTANCE_ID: ${{ secrets.INSTANCE_ID }}
          MODE: ${{ github.event_name == 'schedule' && 'create_and_verify' || github.event.inputs.mode }}
          KEEP_COUNT: ${{ github.event_name == 'schedule' && '10' || github.event.inputs.keep_count }}
          BACKUP_MAX_AGE_HOURS: ${{ github.event_name == 'schedule' && '36' || github.event.inputs.backup_max_age_hours }}
          SCRIPT_B64: ${{ steps.payload.outputs.script_b64 }}
        run: |
          COMMAND=$(cat <<EOF
          mkdir -p /tmp && \
          echo '$SCRIPT_B64' | base64 -d > /tmp/practica-prod-backup-verify.sh && \
          chmod +x /tmp/practica-prod-backup-verify.sh && \
          KEEP_COUNT='$KEEP_COUNT' BACKUP_MAX_AGE_HOURS='$BACKUP_MAX_AGE_HOURS' /bin/bash /tmp/practica-prod-backup-verify.sh '$MODE'
          EOF
          )
          ESCAPED=$(printf '%s' "$COMMAND" | sed 's/\\/\\\\/g; s/"/\\"/g')
          PARAMS="{\"commands\":[\"$ESCAPED\"]}"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Practica prod backup verify" \
            --timeout-seconds 3600 \
            --parameters "$PARAMS" \
            --query "Command.CommandId" --output text)
          echo "SSM CommandId: $CMD_ID"

          for _ in $(seq 1 240); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query 'Status' --output text 2>/dev/null || echo "Pending")
            echo "SSM status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              OUTPUT=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text)
              printf '%s\n' "$OUTPUT"
              {
                echo 'output<<EOF'
                printf '%s\n' "$OUTPUT"
                echo 'EOF'
              } >> "$GITHUB_OUTPUT"
              BACKUP_FILE=$(printf '%s\n' "$OUTPUT" | sed -n 's/^backup_file=//p' | tail -n 1)
              BACKUP_STATUS=$(printf '%s\n' "$OUTPUT" | sed -n 's/^backup_status=//p' | tail -n 1)
              BACKUP_SIZE_BYTES=$(printf '%s\n' "$OUTPUT" | sed -n 's/^backup_size_bytes=//p' | tail -n 1)
              BACKUP_AGE_HOURS=$(printf '%s\n' "$OUTPUT" | sed -n 's/^backup_age_hours=//p' | tail -n 1)
              echo "backup_file=${BACKUP_FILE:-unknown}" >> "$GITHUB_OUTPUT"
              echo "backup_status=${BACKUP_STATUS:-unknown}" >> "$GITHUB_OUTPUT"
              echo "backup_size_bytes=${BACKUP_SIZE_BYTES:-unknown}" >> "$GITHUB_OUTPUT"
              echo "backup_age_hours=${BACKUP_AGE_HOURS:-unknown}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --output text || true
              exit 1
            fi
            sleep 10
          done

          echo "Backup verification timed out" >&2
          exit 1

      - name: Backup summary
        if: ${{ always() && steps.run_backup_verify.outputs.output != '' }}
        run: |
          {
            echo "### Prod Backup Verify"
            echo "- Mode: \`${{ github.event_name == 'schedule' && 'create_and_verify' || github.event.inputs.mode }}\`"
            echo "- Backup status: \`${{ steps.run_backup_verify.outputs.backup_status || 'unknown' }}\`"
            echo "- Backup file: \`${{ steps.run_backup_verify.outputs.backup_file || 'unknown' }}\`"
            echo "- Size bytes: \`${{ steps.run_backup_verify.outputs.backup_size_bytes || 'unknown' }}\`"
            echo "- Age hours: \`${{ steps.run_backup_verify.outputs.backup_age_hours || 'unknown' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack on backup verification failure
        if: ${{ failure() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODE: ${{ github.event_name == 'schedule' && 'create_and_verify' || github.event.inputs.mode }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::warning::SLACK_WEBHOOK_URL not configured; skipping Slack backup alert."
            exit 0
          fi
          MSG=":rotating_light: Practica prod backup verification failed\nMode: ${MODE}\nRun: ${RUN_URL}"
          ESCAPED_MSG=$(printf '%s' "$MSG" | sed 's/\\/\\\\/g; s/"/\\"/g; s/$/\\n/' | tr -d '\n')
          PAYLOAD="{\"text\":\"${ESCAPED_MSG}\"}"
          curl -fsS -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL" || \
            echo "::warning::Slack backup alert failed."
