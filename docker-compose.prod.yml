version: '3.8'

services:
  # PostgreSQL Database for Production
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-practica_prod}
      POSTGRES_USER: ${POSTGRES_USER:-practica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Caching (Production)
  redis:
    image: redis:7-alpine
    volumes:
      - redis_prod_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Backend (Production) — serves API and built frontend via WhiteNoise
  backend:
    image: ${BACKEND_IMAGE:-practica_backend:latest}
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      - DEBUG=0
      - DB_NAME=${POSTGRES_DB:-practica_prod}
      - DB_USER=${POSTGRES_USER:-practica}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME}
      - AWS_S3_REGION_NAME=${AWS_S3_REGION_NAME:-us-east-1}
      - COACH_METRICS_ENABLED=${COACH_METRICS_ENABLED:-False}
      - COACH_METRICS_INTERNAL_USER_IDS=${COACH_METRICS_INTERNAL_USER_IDS:-}
      - COACH_METRICS_MINUTES_SAVED_PER_COMPLETION=${COACH_METRICS_MINUTES_SAVED_PER_COMPLETION:-20}
      - DEPLOYED_GIT_SHA=${DEPLOYED_GIT_SHA:-}
    volumes:
      - prod_media_volume:/app/apps/backend/media
      - prod_static_volume:/app/apps/backend/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Command defined in Dockerfile: gunicorn only; deploy automation runs prep first

volumes:
  postgres_prod_data:
  redis_prod_data:
  prod_media_volume:
  prod_static_volume:
