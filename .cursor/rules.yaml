# Practica — see AGENTS.md and .cursor/rules/{agent,ship,shell}.mdc
description: Cost, repo anchors, gates, shipping.
globs:
  - "**/*"
alwaysApply: true
rules:
  - "Cost: minimize Cursor/agent turns and paid APIs; prefer local work; no new billable integrations without explicit approval."
  - "Sources of truth: AGENTS.md; docs/practica-v2-prd.md for product direction; docs/platform-effects-mvp-playbook.md for shipped baseline."
  - "Backend lives under apps/backend/ (Django, product code in apps/backend/videos/). Frontend: apps/frontend/ (Vite + React)."
  - "Media: do not stream large uploads/downloads through Django; use presigned or direct client-to-storage patterns already in the codebase."
  - "Migrations: for risky columns, prefer nullable → backfill → NOT NULL over big-bang constraints."
  - "Quality gates: ruff on apps/backend/practica/ and apps/backend/videos/; bash scripts/test-core-loop.sh for protected flows; frontend npm run build (see .github/workflows/frontend-ci.yml)."
  - "Ship to main in-session; deploy only via .github/workflows/deploy-ssm.yml; after push verify Actions green and https://practica.jpagan.com/health/ returns 200; fix-forward on failure."
  - "Changing release strategy: update AGENTS.md, this file, and .cursor/rules/ship.mdc together."
